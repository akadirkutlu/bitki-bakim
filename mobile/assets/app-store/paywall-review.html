<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1170, height=2532, initial-scale=1" />
    <title>Premium Paywall Review</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1170px;
        height: 2532px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #faf6ef;
        color: #2b3a2e;
      }

      .screen {
        width: 1170px;
        height: 2532px;
        padding: 72px 48px 80px;
        display: flex;
        flex-direction: column;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 34px;
        font-weight: 600;
        margin-bottom: 28px;
        padding: 0 8px;
      }

      .status-icons {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 28px;
      }

      .header {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 48px;
      }

      .close {
        width: 88px;
        height: 88px;
        border-radius: 999px;
        border: 3px solid #e3dccb;
        background: #ffffff;
        display: grid;
        place-items: center;
        font-size: 42px;
        color: #2b3a2e;
        line-height: 1;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        padding-top: 24px;
      }

      .icon-wrap {
        width: 160px;
        height: 160px;
        border-radius: 56px;
        background: #e7f4e9;
        display: grid;
        place-items: center;
        font-size: 72px;
      }

      .title {
        font-size: 64px;
        font-weight: 800;
        text-align: center;
        line-height: 1.1;
      }

      .subtitle {
        max-width: 900px;
        font-size: 34px;
        line-height: 1.45;
        color: #6e7d71;
        text-align: center;
      }

      .benefits {
        width: 100%;
        background: #ffffff;
        border: 3px solid #e3dccb;
        border-radius: 40px;
        padding: 40px 44px;
      }

      .benefit {
        font-size: 34px;
        font-weight: 600;
        line-height: 1.4;
      }

      .price-card {
        width: 100%;
        background: #fbf0d2;
        border: 3px solid #f2c94c;
        border-radius: 40px;
        padding: 56px 40px;
        text-align: center;
      }

      .price {
        font-size: 72px;
        font-weight: 800;
        line-height: 1.1;
      }

      .price-hint {
        margin-top: 16px;
        font-size: 30px;
        color: #6e7d71;
        line-height: 1.4;
      }

      .primary-button {
        width: 100%;
        background: #4c9a5c;
        color: #ffffff;
        border: none;
        border-radius: 999px;
        padding: 34px 24px;
        font-size: 36px;
        font-weight: 800;
        text-align: center;
      }

      .restore {
        font-size: 34px;
        font-weight: 700;
        color: #2f6b3c;
        text-align: center;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <span>●●●●</span>
          <span>Wi‑Fi</span>
          <span>🔋</span>
        </div>
      </div>

      <div class="header">
        <div class="close">×</div>
      </div>

      <div class="content">
        <div class="icon-wrap">🌿</div>
        <h1 class="title">Premium'a Geç</h1>
        <p class="subtitle">Sınırsız bitki ekle ve bakım takvimini genişlet.</p>

        <div class="benefits">
          <p class="benefit">• Sınırsız bitki ekleme</p>
        </div>

        <div class="price-card">
          <div class="price">₺19,99</div>
          <div class="price-hint">Aylık abonelik, istediğin zaman iptal edebilirsin.</div>
        </div>

        <div class="primary-button">Abone Ol</div>
        <div class="restore">Satın Alımları Geri Yükle</div>
      </div>
    </div>
  </body>
</html>
